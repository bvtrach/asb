name: Temporary hosted runtime-input diagnostics

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-inputs-diagnostic:
    # Reproduce the observed failing image; normal CI remains ubuntu-latest.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the actual executable before diagnostics
        run: cargo build --locked
      - name: Inspect only benign fixture declarations with production definitions
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cargo test --locked --lib hosted_runtime_diagnostic_requires_actual_gate_settlement -- --nocapture
      - name: Exercise all four original Ubuntu26 owning regressions
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for test in \
            collectors::adapters::perfetto::marker_tests::perfetto_declares_namespace_launcher_and_detects_path_shadowing \
            runtime_inputs::tests::discovery_binds_real_interpreters_libraries_and_missing_files_without_running_apps \
            runner::phases::tests::actual_unmeasured_sweep_capture_failure_keeps_grades_reporting_only \
            sweep::phases::tests::actual_sweeps_stop_after_presentation_failure_but_settle_groups_and_partial_reports; do
            log="target/ubuntu26-owning-${test##*::}.log"
            if cargo test --locked --lib "$test" -- --exact > "$log" 2>&1; then
              grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log" || failed=1
            else
              failed=1
            fi
            cat "$log"
          done
          exit "$failed"
      - name: Retain exact bounded loader output and private fixture tracebacks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-inputs-host-diagnostic
          path: crates/asb-cli/target/runtime-host-diagnostic-*
          retention-days: 3
